[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endoflife-fetcher"
version = "1.0.0"
description = "Fetch end-of-life data from endoflife.date API and save as JSON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Tophetei" }
]
keywords = ["endoflife", "eol", "api", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests",
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "responses>=0.23.0",
    "ruff",
    "pre-commit>=3.5.0",
    "mypy>=1.0.0",
    "types-requests",
]

[project.scripts]
endoflife-fetcher = "endoflife_fetcher.cli:main"

[project.urls]
Homepage = "https://github.com/Tophetei/EndOfLife-Fetcher"
Repository = "https://github.com/Tophetei/EndOfLife-Fetcher"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
